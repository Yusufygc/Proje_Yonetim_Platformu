[project]
name = "proje-takip-platformu"
version = "0.1.4"
description = "Proje Yönetim ve Takip Platformu V2"
authors = [
    { name = "ProjeTakip Team" }
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    "mypy>=1.8.0",
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.6.0",
]

[project.scripts]
proje-takip-quality = "scripts.quality:main"

[tool.setuptools.packages.find]
include = ["app*", "core*", "domain*", "services*", "controllers*", "presentation*", "infrastructure*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"] # Mümkün mertebe temiz kod
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Paket __init__ dosyaları yeniden dışa aktarım ve model kaydı için import eder.
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "tests",
]

[tool.pytest.ini_options]
# Takılan bir test sessizce beklemesin: 120 sn sonra tüm iş parçacıklarının yığınını yazar.
faulthandler_timeout = 120
