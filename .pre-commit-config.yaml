repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # Yerel hook: proje bağımlılıklarının (PySide6, SQLAlchemy) kurulu olduğu ortamda tüm paketleri denetler.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy app controllers core domain infrastructure services presentation/viewmodels --ignore-missing-imports
        language: system
        pass_filenames: false
        types: [python]
