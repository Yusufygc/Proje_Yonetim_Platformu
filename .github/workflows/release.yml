name: Release

# `v0.2.0` gibi bir etiket gönderilince installer derlenir ve GitHub Releases'e yüklenir.
# Uygulama açılışta bu yayını denetleyip kullanıcıya güncelleme teklif eder (services/update_service.py).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt

      - name: Etiket ve uygulama sürümü aynı mı
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $appVersion = python -c "from app import config; print(config.APP_VERSION)"
          if ($tagVersion -ne $appVersion) {
            throw "Etiket v$tagVersion ama app/config.py sürümü $appVersion. Önce: python scripts/set_version.py $tagVersion"
          }

      - name: Testler
        run: python -m pytest tests/ -q

      # Ses tanıma modeli boyut nedeniyle depoda yok (.gitignore); pakete girmesi için indirilir.
      - name: Vosk Türkçe modelini indir
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip" -OutFile model.zip
          New-Item -ItemType Directory -Force resources/models | Out-Null
          Expand-Archive model.zip -DestinationPath resources/models
          Remove-Item model.zip

      - name: PyInstaller ile derle
        run: python -m PyInstaller --noconfirm --clean packaging/proje_takip_platformu_dir.spec

      - name: Inno Setup ile installer oluştur
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows.iss

      - name: Yayınla
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/installer/ProjeTakipPlatformuSetup.exe" `
            --title "Proje Takip Platformu ${{ github.ref_name }}" --generate-notes
