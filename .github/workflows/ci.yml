name: CI

on:
  push:
    branches: [main, qml]
  pull_request:

jobs:
  quality:
    # Proje Windows hedefli (PyInstaller, WinAPI çağrıları); testler de aynı platformda koşar.
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Mypy (tip denetimi)
        run: python -m mypy app controllers core domain infrastructure services presentation/viewmodels --ignore-missing-imports

      - name: Pytest
        run: python -m pytest tests/ -q
